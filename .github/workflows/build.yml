name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: js
            os: ubuntu-latest
            task: ":webApp:jsBrowserDistribution"
            path: "webApp/build/dist/js/productionExecutable"

          - name: wasm
            os: ubuntu-latest
            task: ":webApp:wasmJsBrowserDistribution"
            path: "webApp/build/dist/wasmJs/productionExecutable"

          - name: android
            os: ubuntu-latest
            task: ":androidApp:assembleRelease"
            path: "androidApp/build/outputs/apk/release"

          - name: windows
            os: windows-latest
            task: ":desktopApp:packageReleaseDistributionForCurrentOS"
            path: "desktopApp/build/compose"

          - name: linux
            os: ubuntu-latest
            task: ":desktopApp:packageReleaseDistributionForCurrentOS"
            path: "desktopApp/build/compose"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew ${{ matrix.task }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: terralyze-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error